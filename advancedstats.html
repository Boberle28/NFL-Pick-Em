<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pigskin Pick'em Leaderboard</title>
  <style>
   :root{
    --bg:#0b0b0f;           /* dark page background */
    --panel:#141419;        /* card/table background */
    --ink:#e8e8ea;          /* primary text */
    --muted:#a6a7ad;        /* secondary text */
    --line:rgba(255,255,255,.08);
    --accent:#46a0ff;
    --row-odd:rgba(255,255,255,.02);
    --row-even:transparent;
    --row-hover:rgba(70,160,255,.10);
    --sticky-shadow: 0 6px 12px rgba(0,0,0,.35);
  }

  html,body{height:100%}
  body{
    margin:0;
    background:#000; /* matches the rest of your site */
    color:var(--ink);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,'Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.35;
  }

  /* Title */
    #stats-name {
        margin: 0;
        line-height: 1;
    }


h1 {
    margin-bottom: 1rem;
    color: #d4d2d2;
}

.total-pot {
    margin-bottom: 1rem;
    color: #d4d2d2;
}

.total-pot .pot{
    background: linear-gradient(90deg, #05ab37, #077528);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

a {
    display: inline;
    margin-bottom: 1rem;
    color: #007bff;
    text-decoration: none;
}

  .wrap{
    max-width: 1100px;
    margin: 24px auto 80px;
    padding: 0 16px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.30);
  }

  .table-wrap{
    overflow:auto;
  }

  table{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    font-size:14px;
  }

  thead th{
    position:sticky; top:0; z-index:2;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    text-align:left;
    font-weight:600;
    padding:12px 12px;
    white-space:nowrap;
  }
  thead th.sticky-shadow::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-1px; height:1px;
    box-shadow:var(--sticky-shadow);
    opacity:.4;
  }


    tbody td{
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
  }

   tbody tr:nth-child(odd){ background:var(--row-odd); }
  tbody tr:nth-child(even){ background:var(--row-even); }
  tbody tr:hover{ background:var(--row-hover); }

   #board {
  min-width: 860px; /* adjust as needed */
}

    /* Freeze the first column (header + cells) */
#board thead th:first-child,
#board tbody td:first-child {
  position: sticky;
  left: 0;
  z-index: 3;                /* keep above other cells */
  min-width: 80px;     /* was too wide — tighten it up */
  max-width: 120px;
  background: var(--panel);  /* same as header/table bg */
}

    /* A tiny divider & depth so it looks natural */
#board thead th:first-child {
  border-right: 1px solid var(--line);
  box-shadow: none;
}
#board tbody td:first-child {
  z-index: 2; /* under header but above other cells */
  border-right: 1px solid var(--line);
  box-shadow: none;
}

    .header-meta {
  text-align: center;
  margin: 12px 0 16px;
}

    .rank{
    width:56px; text-align:right; color:var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .player{
    display:flex; align-items:center; gap:10px; min-width:220px;
  }
  .avatar{
    width:28px; height:28px; border-radius:50%; overflow:hidden; flex:0 0 auto;
    background:#222;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .player .name{font-weight:600}
  .player .team{color:var(--muted); font-size:12px}

    .num, .center{
    text-align:center;
    font-variant-numeric: tabular-nums;
  }
  .right{ text-align:right; font-variant-numeric: tabular-nums; }

    /* mobile: stack some columns */
  @media (max-width: 720px){
    .rank{ width:44px; }
    .hide-sm{ display:none; }
    .player{ min-width:160px; }
    thead th, tbody td{ padding:10px 10px; }
  }
  </style>
</head>
<body>
  <div class="header-meta">
        <h1 id="stats-name">Pigskin Pick'em </h1>
        <a class="back-link" id="back-link" href="userstatstemplate.html">⬅ Back to User Stats</a>
    </div>
<main class="wrap">
  <div class="card">
    

    <div class="table-wrap">
      <table id="board">
        <thead>
          <tr>
            <th>Week</th>
            <th>Total Wins</th>
            <th>Favorites Picked</th>
            <th>Favorites Won</th>
            <th>Favorite Win Percent</th>
            <th>Underdogs Picked</th>
            <th>Underdogs Won</th>
            <th>Underdog Win Percent</th>
            <th>Underdog Points</th>
            <th>Total Points</th>
            <th>Total Possible Points</th>
            <th>Rank</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>
<script src ="NamesAndSchedule.js"></script>
<script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAHTX6gGorh3Flmvbw0THBfk9i7ILeZ2E4",
      authDomain: "football-pickem-1d2ab.firebaseapp.com",
      projectId: "football-pickem-1d2ab",
      storageBucket: "football-pickem-1d2ab.firebasestorage.app",
      messagingSenderId: "1065963734942",
      appId: "1:1065963734942:web:042b5fbe5082b9cd29788f",
      measurementId: "G-K8JV62VJ6P"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const auth = getAuth(app);

    let state = {
  sortKey: "points",
  sortDir: "desc", // 'asc' | 'desc'
  q: ""
};

            const params = new URLSearchParams(window.location.search);
            const username = params.get("user");

const rowsEl = document.getElementById("rows");
const board = document.getElementById("board");

function render() {
  let filtered = DATA.filter(r => {
    if (!state.q) return true;
    const q = state.q.toLowerCase();
    return r.name.toLowerCase().includes(q) || String(r.team).toLowerCase().includes(q);
  });

  const dir = state.sortDir === "asc" ? 1 : -1;
  filtered.sort((a,b)=>{
    const k = state.sortKey;
    const va = a[k], vb = b[k];
    if (typeof va === "string" || typeof vb === "string") {
      return va.toString().localeCompare(vb.toString(), undefined, {numeric:true}) * dir;
    }
    return (va - vb) * dir;
  });

  // rank recalculates after filtering/sorting
  rowsEl.innerHTML = filtered.map((r, idx) => `
    <tr>
      <td>
        
      <div class="name">${r.name}</div>
          
      </td>
      <td class="hide-sm">${r.team}</td>
      <td class="center">${r.wins}</td>
      <td class="center hide-sm">${r.losses}</td>
      <td class="center">${(r.pct).toFixed(3)}</td>
      <td class="right">${r.points}</td>
    </tr>
  `).join("");

  // update sort header styles
  document.querySelectorAll("th.sortable").forEach(th=>{
    th.classList.toggle("active", th.dataset.key === state.sortKey);
    th.classList.toggle("asc", th.dataset.key === state.sortKey && state.sortDir==="asc");
  });
}

    async function asyncStuff(){
        const predata = await fetch("preseason.json").then(res => res.json());
        const data = await fetch("weeklyData.json", { cache: "no-store" }).then(res => res.json());

        UpdateRecords(data.teams);

        season.LoadOdds(data.weeks)
        season.LoadOddsPreseason(predata);

        const elem = document.getElementById("back-link");
        elem.href = `userstatstemplate.html?user=${username}`;

        const picksRef = collection(db, "picks");
        const snapshot = await getDocs(picksRef);

        return snapshot;
    }

    async function buildLeaderboard() {
    
      let snapshot = await asyncStuff();
      PullUsersAndGetWins(snapshot);
    
      document.getElementById("stats-name").innerText = `Advanced Stats for ${username}`;

      const tbody = document.getElementById("rows");
      tbody.innerHTML = "";
      let weekNum = 1;

      let player = null;
      for (let p of Object.values(players)){
        console.log("inside let player of Object.values(players)")
        if(username == p.username){
            console.log("username match!!!");
            player = p;
        }
      }
      
      let favoritesPicked = 0;
      let favoritesWon = 0;
      let underdogsPicked = 0;
      let underdogsWon = 0;
      let underdogPoints = 0;
      let weekstatWins = 0;

      console.log("player", player);
      for (let stat of Object.values(player.weekAdvanced)){
        const row = document.createElement("tr");

        let favoriteWinP = stat.favoritesPicked ? Number((stat.favoritesWon / stat.favoritesPicked) * 100).toFixed(2) : 0;
        let underdogWinP = stat.underdogsWon ? Number((stat.underdogsWon / stat.underdogsPicked) * 100).toFixed(2) : 0;
        const weekstat = player.weekStats[weekNum - 1];
        weekstatWins += weekstat.wins;
        const totalPointsPossible = Number(season.weeks[weekNum -1].underdogPoints + season.weeks[weekNum -1].favoritePoints).toFixed(2);

        favoritesPicked += stat.favoritesPicked;
        favoritesWon += stat.favoritesWon;
        underdogsPicked += stat.underdogsPicked;
        underdogsWon += stat.underdogsWon;
        underdogPoints += stat.underdogPoints;

        row.innerHTML = `
          <td data-label="Week" class="userrow">Week ${weekNum}</td>
          <td data-label="Total Wins">${weekstat.wins}</td>
          <td data-label="Favorites Picked">${stat.favoritesPicked}</td>
          <td data-label="Favorites Won">${stat.favoritesWon}</td>
          <td data-label="Favorite Win Percent">${favoriteWinP}%</td>
          <td data-label="Underdogs Picked">${stat.underdogsPicked}</td>
          <td data-label="Underdogs Won">${stat.underdogsWon}</td>
          <td data-label="Underdog Win Percent">${underdogWinP}%</td>
          <td data-label="Underdog Points">${Number(stat.underdogPoints).toFixed(2)}</td>
          <td data-label="Total Points">${Number(stat.favoritesWon + stat.underdogPoints).toFixed(2)}</td>
          <td data-label="Total Possible Points">${totalPointsPossible}</td>
          <td data-label="Rank">--</td>
        `;

        tbody.appendChild(row);
        ++weekNum;
      }

      let favoriteWinP = favoritesPicked ? Number((favoritesWon / favoritesPicked) * 100).toFixed(2) : 0;
      let underdogWinP = underdogsPicked ? Number((underdogsWon / underdogsPicked) * 100).toFixed(2) : 0;
      let totalPointsForSeason = Number(season.favoriteWins + season.underdogPoints).toFixed(2);

      const row = document.createElement("tr");
      row.innerHTML = `
          <td data-label="Week" class="userrow">Total</td>
          <td data-label="Total Wins">${weekstatWins}</td>
          <td data-label="Favorites Picked">${favoritesPicked}</td>
          <td data-label="Favorites Won">${favoritesWon}</td>
          <td data-label="Favorite Win Percent">${favoriteWinP}%</td>
          <td data-label="Underdogs Picked">${underdogsPicked}</td>
          <td data-label="Underdogs Won">${underdogsWon}</td>
          <td data-label="Underdog Win Percent">${underdogWinP}%</td>
          <td data-label="Underdog Points">${Number(underdogPoints).toFixed(2)}</td>
          <td data-label="Total Points">${Number(favoritesWon + underdogPoints).toFixed(2)}</td>
          <td data-label="Total Possible Points">${totalPointsForSeason}</td>
          <td data-label="Rank">--</td>
        `;

        tbody.appendChild(row);
    }

    function refreshPageState()
    {
      buildLeaderboard();
    }

    window.addEventListener("DOMContentLoaded", () => {
      onAuthStateChanged(auth, (user) => {
        if (user) {
          buildLeaderboard(); // safe to access Firestore now
        } else {
          window.location.href = "index.html"; // redirect if not logged in
        }
      });
    });

    window.addEventListener("pageshow", (event) => {
       if (event.persisted) {
           buildLeaderboard(); // safe to access Firestore now();
       }
    });

    document.addEventListener("visibilitychange", () => {
       if (document.visibilityState === "visible") {
           refreshPageState();
       }
    });

  </script>
</body>
</html>
